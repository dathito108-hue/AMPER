name: Android CI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification depth
        required: true
        default: full
        type: choice
        options:
          - fast
          - full
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - '.github/qualification-apk-trigger'
      - '.github/operational-apk-trigger'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      native_changed: ${{ steps.changes.outputs.native_changed }}
      mtmd_changed: ${{ steps.changes.outputs.mtmd_changed }}
      amne_changed: ${{ steps.changes.outputs.amne_changed }}
      llama_changed: ${{ steps.changes.outputs.llama_changed }}
      operational_llama: ${{ steps.changes.outputs.operational_llama }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect native/build impact
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "operational_llama=false" >> "$GITHUB_OUTPUT"
          echo "native_changed=false" >> "$GITHUB_OUTPUT"
          echo "mtmd_changed=false" >> "$GITHUB_OUTPUT"
          echo "amne_changed=false" >> "$GITHUB_OUTPUT"
          echo "llama_changed=false" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MODE" == "full" ]]; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            echo "mtmd_changed=true" >> "$GITHUB_OUTPUT"
            echo "amne_changed=true" >> "$GITHUB_OUTPUT"
            echo "llama_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            exit 0
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            CHANGED="$(git diff --name-only HEAD^ "$GITHUB_SHA")"
            if printf "%s\n" "$CHANGED" | grep -qx '.github/operational-apk-trigger'; then
              echo "operational_llama=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          git fetch --no-tags origin "$BASE_SHA" --depth=1
          CHANGED="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          printf "%s\n" "$CHANGED"

          if printf "%s\n" "$CHANGED" | grep -Eq '^app/src/mtmdNative/'; then
            echo "mtmd_changed=true" >> "$GITHUB_OUTPUT"
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if printf "%s\n" "$CHANGED" | grep -Eq '^app/src/amneNative/'; then
            echo "amne_changed=true" >> "$GITHUB_OUTPUT"
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if printf "%s\n" "$CHANGED" | grep -Eq '^app/src/llamaAar/'; then
            echo "llama_changed=true" >> "$GITHUB_OUTPUT"
          fi

          if printf "%s\n" "$CHANGED" | grep -qx 'app/build.gradle.kts' &&
             ! printf "%s\n" "$CHANGED" | grep -Eq '^app/src/(mtmdNative|amneNative|llamaAar)/'; then
            BUILD_PATCH="$(git diff --unified=0 "$BASE_SHA" "$GITHUB_SHA" -- app/build.gradle.kts | grep -E '^[+-][^+-]' || true)"
            if printf "%s\n" "$BUILD_PATCH" | grep -Eqi 'mtmd|spirv|vulkan'; then
              echo "mtmd_changed=true" >> "$GITHUB_OUTPUT"
              echo "native_changed=true" >> "$GITHUB_OUTPUT"
            fi
            if printf "%s\n" "$BUILD_PATCH" | grep -Eqi 'amne'; then
              echo "amne_changed=true" >> "$GITHUB_OUTPUT"
              echo "native_changed=true" >> "$GITHUB_OUTPUT"
            fi
            if printf "%s\n" "$BUILD_PATCH" | grep -Eqi 'llama'; then
              echo "llama_changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          if printf "%s\n" "$CHANGED" | grep -Eq '^(app/src/main/cpp/|app/src/main/jni/|build.gradle|settings.gradle|gradle/)'; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            echo "mtmd_changed=true" >> "$GITHUB_OUTPUT"
            echo "amne_changed=true" >> "$GITHUB_OUTPUT"
            echo "llama_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Qualify AMNE native reference math on host
        if: steps.changes.outputs.amne_changed == 'true'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -ffp-contract=off \
            app/src/amneNative/cpp/amne_kernels.cpp \
            app/src/amneNative/cpp/amne_reference_test.cpp \
            -o /tmp/amne-reference-test
          /tmp/amne-reference-test
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build canonical debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Write canonical APK provenance
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          MODE_LABEL="${DISPATCH_MODE:-fast-main-trigger}"
          sha256sum "$APK" | tee "$APK.sha256"
          {
            echo "git_sha=$GITHUB_SHA"
            echo "git_ref=$GITHUB_REF"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_number=$GITHUB_RUN_NUMBER"
            echo "mode=$MODE_LABEL"
          } > "$APK.provenance.txt"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          name: AMPER-canonical-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/app-debug.apk.provenance.txt
          retention-days: 7

  operational-llama-apk:
    needs: verify
    if: needs.verify.outputs.operational_llama == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install AMNE Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
      - name: Build operational AMNE + llama fallback APK
        run: gradle :app:assembleDebug -PwithAmneNative=true -PwithLlamaAar=true --stacktrace
      - name: Verify packaged arm64 AMNE + text runtime
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" > /tmp/amper-operational-apk-files.txt
          grep -q 'lib/arm64-v8a/libamne.so' /tmp/amper-operational-apk-files.txt
          grep -q 'lib/arm64-v8a/libllama_jni.so' /tmp/amper-operational-apk-files.txt
          grep -q 'lib/arm64-v8a/libllama.so' /tmp/amper-operational-apk-files.txt
          grep -Eq 'lib/arm64-v8a/libggml(-base|-cpu)?\.so' /tmp/amper-operational-apk-files.txt
      - name: Write operational APK provenance
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="app/build/outputs/apk/debug/AMPER-operational-text-runtime-$GITHUB_SHA.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          {
            echo "git_sha=$GITHUB_SHA"
            echo "git_ref=$GITHUB_REF"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_number=$GITHUB_RUN_NUMBER"
            echo "package_mode=amne-native+llama-aar-operational"
          } > "$OUT.provenance.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: AMPER-operational-text-runtime-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/AMPER-operational-text-runtime-${{ github.sha }}.apk
            app/build/outputs/apk/debug/AMPER-operational-text-runtime-${{ github.sha }}.apk.sha256
            app/build/outputs/apk/debug/AMPER-operational-text-runtime-${{ github.sha }}.apk.provenance.txt
          retention-days: 7

  optional-llama-aar:
    needs: verify
    if: needs.verify.outputs.llama_changed == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build optional prebuilt llama.cpp backend APK
        run: gradle :app:assembleDebug -PwithLlamaAar=true --stacktrace
      - name: Verify packaged arm64 llama runtime
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" > /tmp/amper-apk-files.txt
          grep -q 'lib/arm64-v8a/libllama_jni.so' /tmp/amper-apk-files.txt
          grep -q 'lib/arm64-v8a/libllama.so' /tmp/amper-apk-files.txt
          grep -Eq 'lib/arm64-v8a/libggml(-base|-cpu)?\.so' /tmp/amper-apk-files.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        with:
          name: AMPER-llama-aar-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  amne-native-arm64:
    needs: verify
    if: needs.verify.outputs.amne_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
      - name: Build AMNE + llama fallback arm64 APK
        run: gradle :app:assembleDebug -PwithAmneNative=true -PwithLlamaAar=true --stacktrace
      - name: Verify packaged AMNE and fallback runtime
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" > /tmp/amper-amne-apk-files.txt
          grep -q 'lib/arm64-v8a/libamne.so' /tmp/amper-amne-apk-files.txt
          grep -q 'lib/arm64-v8a/libllama_jni.so' /tmp/amper-amne-apk-files.txt
          grep -q 'lib/arm64-v8a/libllama.so' /tmp/amper-amne-apk-files.txt

  native-mtmd-arm64:
    needs: verify
    if: needs.verify.outputs.mtmd_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
      - name: Build native libmtmd arm64 APK
        run: gradle :app:assembleDebug -PwithMtmdNative=true --stacktrace
      - name: Verify packaged native MTMD runtime
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" > /tmp/amper-mtmd-apk-files.txt
          grep -q 'lib/arm64-v8a/libamper_mtmd.so' /tmp/amper-mtmd-apk-files.txt
          grep -q 'lib/arm64-v8a/libmtmd.so' /tmp/amper-mtmd-apk-files.txt
          grep -q 'lib/arm64-v8a/libllama.so' /tmp/amper-mtmd-apk-files.txt
          grep -Eq 'lib/arm64-v8a/libggml(-base|-cpu)?\.so' /tmp/amper-mtmd-apk-files.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        with:
          name: AMPER-mtmd-native-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  native-mtmd-vulkan-arm64:
    needs: verify
    if: needs.verify.outputs.mtmd_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Vulkan host tools and Android NDK/CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc spirv-headers libvulkan-dev
          glslc --version
          SPIRV_CONFIG="$(dpkg -L spirv-headers | grep '/SPIRV-HeadersConfig.cmake$' | head -n 1)"
          test -n "$SPIRV_CONFIG"
          echo "AMPER_SPIRV_HEADERS_DIR=$(dirname "$SPIRV_CONFIG")" >> "$GITHUB_ENV"
          test -f /usr/include/vulkan/vulkan.hpp
          mkdir -p /tmp/amper-vulkan-headers
          cp -a /usr/include/vulkan /tmp/amper-vulkan-headers/
          cp -a /usr/include/spirv /tmp/amper-vulkan-headers/
          test -f /tmp/amper-vulkan-headers/vulkan/vulkan.hpp
          test -f /tmp/amper-vulkan-headers/spirv/unified1/spirv.hpp
          echo "AMPER_VULKAN_HEADERS_DIR=/tmp/amper-vulkan-headers" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
      - name: Build Vulkan native libmtmd arm64 APK
        run: gradle :app:assembleDebug -PwithMtmdVulkan=true -PspirvHeadersDir="$AMPER_SPIRV_HEADERS_DIR" -PvulkanHeadersDir="$AMPER_VULKAN_HEADERS_DIR" --stacktrace
      - name: Verify packaged Vulkan MTMD runtime
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" > /tmp/amper-mtmd-vulkan-apk-files.txt
          grep -q 'lib/arm64-v8a/libamper_mtmd.so' /tmp/amper-mtmd-vulkan-apk-files.txt
          grep -q 'lib/arm64-v8a/libmtmd.so' /tmp/amper-mtmd-vulkan-apk-files.txt
          grep -q 'lib/arm64-v8a/libllama.so' /tmp/amper-mtmd-vulkan-apk-files.txt
          grep -Eq 'lib/arm64-v8a/libggml(-base|-cpu)?\.so' /tmp/amper-mtmd-vulkan-apk-files.txt
          grep -q 'lib/arm64-v8a/libggml-vulkan.so' /tmp/amper-mtmd-vulkan-apk-files.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        with:
          name: AMPER-mtmd-vulkan-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk

name: Android CI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification depth
        required: true
        default: full
        type: choice
        options:
          - fast
          - full
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - '.github/amne-apk-trigger'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      amne_native_changed: ${{ steps.changes.outputs.amne_native_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect AMPER Core native impact
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "amne_native_changed=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MODE" == "full" ]]; then
            echo "amne_native_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            exit 0
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            CHANGED="$(git diff --name-only HEAD^ "$GITHUB_SHA")"
            if printf "%s\n" "$CHANGED" | grep -qx '.github/amne-apk-trigger'; then
              echo "amne_native_changed=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          git fetch --no-tags origin "$BASE_SHA" --depth=1
          CHANGED="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          printf "%s\n" "$CHANGED"
          if printf "%s\n" "$CHANGED" | grep -Eq '^(app/src/amneNative/|app/build\.gradle\.kts$)'; then
            echo "amne_native_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build canonical debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Write canonical APK provenance
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          MODE_LABEL="${DISPATCH_MODE:-fast-main-trigger}"
          sha256sum "$APK" | tee "$APK.sha256"
          {
            echo "git_sha=$GITHUB_SHA"
            echo "git_ref=$GITHUB_REF"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_number=$GITHUB_RUN_NUMBER"
            echo "mode=$MODE_LABEL"
            echo "architecture=amper-single-core"
          } > "$APK.provenance.txt"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          name: AMPER-canonical-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/app-debug.apk.provenance.txt
          retention-days: 7

  amper-core-arm64:
    needs: verify
    if: needs.verify.outputs.amne_native_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
      - name: Build AMPER Core ARM64 APK
        run: gradle :app:assembleDebug -PwithAmneNative=true --stacktrace
      - name: Verify AMPER-only inference runtime
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" > /tmp/amper-core-apk-files.txt
          grep -q 'lib/arm64-v8a/libamper_amne.so' /tmp/amper-core-apk-files.txt
          if grep -Eq 'lib/arm64-v8a/(libllama|libmtmd|libggml)' /tmp/amper-core-apk-files.txt; then
            echo "Foreign model runtime library detected in AMPER single-core APK" >&2
            exit 1
          fi
      - name: Write AMPER Core APK provenance
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="app/build/outputs/apk/debug/AMPER-single-core-$GITHUB_SHA.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          {
            echo "git_sha=$GITHUB_SHA"
            echo "git_ref=$GITHUB_REF"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_number=$GITHUB_RUN_NUMBER"
            echo "package_mode=amper-single-core-ami-amne-only"
            echo "amne_native_abi=3"
            echo "foreign_model_runtimes=none"
          } > "$OUT.provenance.txt"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          name: AMPER-single-core-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/AMPER-single-core-${{ github.sha }}.apk
            app/build/outputs/apk/debug/AMPER-single-core-${{ github.sha }}.apk.sha256
            app/build/outputs/apk/debug/AMPER-single-core-${{ github.sha }}.apk.provenance.txt
          retention-days: 7
